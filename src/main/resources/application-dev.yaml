# development configuration
server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: root
    password: root
    hikari:
      pool-name: hikariCP
      maximum-pool-size: 5
      connection-time-out: 10000
      idle-time-out: 600000
      max-lifetime: 1800000
      validation-timeout: 1800000
      leak-detection-threshold: 0
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format-sql: true
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            #login/oauth2/code/google
            client-id: ${GOOGLE_CLIENT_ID:450692283212-7orjskasu7gmfeno1jfhuvnkun6ftcb6.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:GOCSPXCH5Q5sfhJHcGDaI2M7o0bGb6wceu}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
          github:
#            login/oauth2/code/github
            client-id: ${GITHUB_CLIENT_ID:Ov23lisBabIwLwm65U0j}
            client-secret: ${GITHUB_CLIENT_SECRET:67ff6145884e36cc588adf2454d36785af8875c5}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - user:email
              - read:profile



logging:
  level:
    org.springframework.web: DEBUG

security:
  jwt:
    secret: ${JWT_SECRET:karan-xfchgvbj-dgfchg-nb-23456789-dgfhjhfchvgjh-trxyctuvyhkb6yjhb-rdf4r6ry75t5ry5rtr77y}
    issuer: ${JWT_ISSUER:api.substring.com}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}
    cookie-same-site: ${JWT_COOKIE_SITE:Strict}
    cookie-domain: ${JWT_COOKIE_DOMAIN:localhost}


app:
  auth:
    frontend:
      success-redirect: http://localhost:8082/auth/success
      failure-redirect: http://localhost:8082/auth/failure
