# development configuration
server:
  port: 8082
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: root
    password: root

    hikari:
      pool-name: hikariCP
      maximum-pool-size: 5
      connection-time-out : 10000
      idle-time-out: 600000
      max-lifetime: 1800000
      validation-timeout: 1800000
      leak-detection-threshold: 0
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format-sql: true
    show-sql: true

logging:
  level:
    org.springframework.web: DEBUG
security :
  jwt:
    secrete: ${JTW_SECRETE:U2VjdXJlS2V5Rm9ySm9oag==}
    issuer: ${JWT_ISSUER:api.substring.com}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:86400}
    refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refreshToken}
    cookie-secure: ${JWT_COOKIE_SECURE:true}
    cookie-http-only: ${JWT_COOKIE_HTTP_ONLY:true}


