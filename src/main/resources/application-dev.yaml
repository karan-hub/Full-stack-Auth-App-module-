# development configuration
server:
  port: 8082
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db
    username: root
    password: root

    hikari:
      pool-name: hikariCP
      maximum-pool-size: 5
      connection-time-out : 10000
      idle-time-out: 600000
      max-lifetime: 1800000
      validation-timeout: 1800000
      leak-detection-threshold: 0
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format-sql: true
    show-sql: true

